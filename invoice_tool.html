<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Time & Invoice Suite</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .section {
            margin-bottom: 30px;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 5px;
        }
        pre {
            white-space: pre-wrap;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smart Time & Invoice Suite</h1>

        <!-- Projektverwaltung -->
        <div class="section">
            <h2>Projektverwaltung</h2>
            <div class="form-group">
                <label for="newProjectName">Neues Projekt:</label>
                <input type="text" id="newProjectName" placeholder="Projektname">
            </div>
            <div class="form-group">
                <label>Zugehörige Kunden:</label>
                <div id="newProjectCustomers"></div>
            </div>
            <button onclick="addProject()">Projekt hinzufügen</button>
        </div>

        <!-- Kundenverwaltung -->
        <div class="section">
            <h2>Kundenverwaltung</h2>
            <div class="form-group">
                <label for="newCustomerName">Neuer Kunde:</label>
                <input type="text" id="newCustomerName" placeholder="Kundenname">
            </div>
            <button onclick="addCustomer()">Kunde hinzufügen</button>
        </div>

        <!-- Stundenerfassung -->
        <div class="section">
            <h2>Stundenerfassung</h2>
            <div class="form-group">
                <label for="project">Projekt:</label>
                <select id="project" onchange="updateCustomerDropdown()">
                    <option value="">-- Projekt auswählen --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="customer">Kunde:</label>
                <select id="customer" disabled>
                    <option value="">-- Kunde auswählen --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="description">Beschreibung:</label>
                <input type="text" id="description">
            </div>
            <div class="form-group">
                <label for="hours">Stunden:</label>
                <input type="number" id="hours" step="0.25" min="0" value="0">
            </div>
            <button onclick="addEntry()">Stunde hinzufügen</button>
        </div>

        <!-- Datenverwaltung -->
        <div class="section">
            <button onclick="importDataFromGitHub()">Daten von GitHub importieren</button>
            <button onclick="exportDataToGitHub()">Daten nach GitHub exportieren</button>
        </div>

        <!-- Erfasste Stunden -->
        <div class="section">
            <h2>Erfasste Stunden</h2>
            <table id="timeTable">
                <thead>
                    <tr>
                        <th>Datum</th>
                        <th>Projekt</th>
                        <th>Kunde</th>
                        <th>Beschreibung</th>
                        <th>Stunden</th>
                        <th>Aktion</th>
                    </tr>
                </thead>
                <tbody id="timeTableBody"></tbody>
            </table>
        </div>

        <!-- Rechnung erstellen -->
        <div class="section">
            <h2>Rechnung erstellen</h2>
            <div class="form-group">
                <label for="invoiceProject">Projekt:</label>
                <select id="invoiceProject" onchange="updateInvoiceCustomerDropdown()">
                    <option value="">-- Projekt auswählen --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="invoiceCustomer">Kunde:</label>
                <select id="invoiceCustomer">
                    <option value="">-- Kunde auswählen --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="invoiceMonth">Monat:</label>
                <input type="month" id="invoiceMonth">
            </div>
            <button onclick="generateInvoice()">Rechnung generieren</button>
        </div>
    </div>

    <script>
        // Dateninitialisierung
        let projects = [];
        let customers = [];
        let timeEntries = [];
        let nextProjectId = 1;
        let nextCustomerId = 1;

        // Daten aus localStorage laden
        function loadLocalData() {
            const savedData = {
                timeEntries: JSON.parse(localStorage.getItem('smartTimeData') || '[]'),
                projects: JSON.parse(localStorage.getItem('projects') || '[]'),
                customers: JSON.parse(localStorage.getItem('customers') || '[]'),
                nextProjectId: parseInt(localStorage.getItem('nextProjectId') || '1'),
                nextCustomerId: parseInt(localStorage.getItem('nextCustomerId') || '1')
            };

            if (savedData.projects.length > 0) {
                projects = savedData.projects;
                nextProjectId = savedData.nextProjectId;
            } else {
                // Standard-Projekte
                projects = [
                    { id: 1, name: "Wissenschafts- und Kulturpark Schwielowsee", customerIds: [1] },
                    { id: 2, name: "Schwarze Pumpe", customerIds: [2, 3] },
                    { id: 3, name: "Projekt 3", customerIds: [1, 2] },
                    { id: 4, name: "Projekt 4", customerIds: [3] },
                    { id: 5, name: "4D Cell", customerIds: [4] }
                ];
                nextProjectId = 6;
            }

            if (savedData.customers.length > 0) {
                customers = savedData.customers;
                nextCustomerId = savedData.nextCustomerId;
            } else {
                // Standard-Kunden mit Adressen
                customers = [
                    { id: 1, name: "Gegenbauer", address: "Musterstraße 1, 10115 Berlin" },
                    { id: 2, name: "Christine Herntier", address: "Beispielweg 2, 10117 Berlin" },
                    { id: 3, name: "Zweckverband", address: "Testallee 3, 10119 Berlin" },
                    { id: 4, name: "Joh Schöneberg", address: "Demostraße 4, 14542 Schwielowsee" }
                ];
                nextCustomerId = 5;
            }

            timeEntries = savedData.timeEntries;
        }

        // Alle Dropdowns aktualisieren
        function updateAllDropdowns() {
            populateProjectDropdowns();
            populateCustomerDropdowns();
            updateTable();
        }

        // Projekt-Dropdowns füllen
        function populateProjectDropdowns() {
            const projectSelect = document.getElementById('project');
            const invoiceProjectSelect = document.getElementById('invoiceProject');

            [projectSelect, invoiceProjectSelect].forEach(select => {
                select.innerHTML = '<option value="">-- Projekt auswählen --</option>';
                projects.forEach(project => {
                    const option = document.createElement('option');
                    option.value = project.id;
                    option.textContent = project.name;
                    select.appendChild(option);
                });
            });
        }

        // Kunden-Dropdowns füllen
        function populateCustomerDropdowns() {
            const customerSelect = document.getElementById('invoiceCustomer');
            customerSelect.innerHTML = '<option value="">-- Kunde auswählen --</option>';
            customers.forEach(customer => {
                const option = document.createElement('option');
                option.value = customer.id;
                option.textContent = customer.name;
                customerSelect.appendChild(option);
            });
        }

        // Kunden-Dropdown für Stundenerfassung aktualisieren
        function updateCustomerDropdown() {
            const projectId = parseInt(document.getElementById('project').value);
            const customerSelect = document.getElementById('customer');

            if (!projectId) {
                customerSelect.innerHTML = '<option value="">-- Kunde auswählen --</option>';
                customerSelect.disabled = true;
                return;
            }

            const project = projects.find(p => p.id === projectId);
            if (!project) {
                customerSelect.innerHTML = '<option value="">-- Keine Kunden für dieses Projekt --</option>';
                customerSelect.disabled = true;
                return;
            }

            customerSelect.innerHTML = '<option value="">-- Kunde auswählen --</option>';
            project.customerIds.forEach(customerId => {
                const customer = customers.find(c => c.id === customerId);
                if (customer) {
                    const option = document.createElement('option');
                    option.value = customer.id;
                    option.textContent = customer.name;
                    customerSelect.appendChild(option);
                }
            });
            customerSelect.disabled = false;
        }

        // Kunden-Dropdown für Rechnungserstellung aktualisieren
        function updateInvoiceCustomerDropdown() {
            const projectId = parseInt(document.getElementById('invoiceProject').value);
            const customerSelect = document.getElementById('invoiceCustomer');

            if (!projectId) {
                customerSelect.innerHTML = '<option value="">-- Kunde auswählen --</option>';
                return;
            }

            const project = projects.find(p => p.id === projectId);
            if (!project) {
                customerSelect.innerHTML = '<option value="">-- Keine Kunden für dieses Projekt --</option>';
                return;
            }

            customerSelect.innerHTML = '<option value="">-- Kunde auswählen --</option>';
            project.customerIds.forEach(customerId => {
                const customer = customers.find(c => c.id === customerId);
                if (customer) {
                    const option = document.createElement('option');
                    option.value = customer.id;
                    option.textContent = customer.name;
                    customerSelect.appendChild(option);
                }
            });
        }

        // Checkboxen für neue Projekte erstellen
        function updateNewProjectCustomers() {
            const container = document.getElementById('newProjectCustomers');
            container.innerHTML = '';

            customers.forEach(customer => {
                const div = document.createElement('div');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `new_project_customer_${customer.id}`;
                checkbox.value = customer.id;

                const label = document.createElement('label');
                label.htmlFor = `new_project_customer_${customer.id}`;
                label.textContent = customer.name;

                div.appendChild(checkbox);
                div.appendChild(label);
                container.appendChild(div);
            });
        }

        // Neues Projekt hinzufügen
        function addProject() {
            const name = document.getElementById('newProjectName').value.trim();
            if (!name) {
                alert('Bitte geben Sie einen Projektnamen ein!');
                return;
            }

            const customerIds = [];
            const checkboxes = document.querySelectorAll('#newProjectCustomers input[type="checkbox"]:checked');
            checkboxes.forEach(checkbox => {
                customerIds.push(parseInt(checkbox.value));
            });

            if (customerIds.length === 0) {
                alert('Bitte wählen Sie mindestens einen Kunden für das Projekt aus!');
                return;
            }

            const newProject = {
                id: nextProjectId++,
                name: name,
                customerIds: customerIds
            };

            projects.push(newProject);
            localStorage.setItem('projects', JSON.stringify(projects));
            localStorage.setItem('nextProjectId', nextProjectId);

            document.getElementById('newProjectName').value = '';
            const checkboxesAll = document.querySelectorAll('#newProjectCustomers input[type="checkbox"]');
            checkboxesAll.forEach(checkbox => {
                checkbox.checked = false;
            });

            alert(`Projekt "${name}" wurde mit ${customerIds.length} Kunden hinzugefügt!`);
            updateAllDropdowns();
        }

        // Neuer Kunde hinzufügen
        function addCustomer() {
            const name = document.getElementById('newCustomerName').value.trim();
            if (!name) {
                alert('Bitte geben Sie einen Kundennamen ein!');
                return;
            }

            const newCustomer = {
                id: nextCustomerId++,
                name: name,
                address: "" // Adresse kann später ergänzt werden
            };

            customers.push(newCustomer);
            localStorage.setItem('customers', JSON.stringify(customers));
            localStorage.setItem('nextCustomerId', nextCustomerId);

            document.getElementById('newCustomerName').value = '';
            updateNewProjectCustomers();
            alert(`Kunde "${name}" wurde hinzugefügt!`);
            updateAllDropdowns();
        }

        // Tabelle aktualisieren
        function updateTable() {
            const tableBody = document.getElementById('timeTableBody');
            tableBody.innerHTML = '';

            timeEntries.forEach((entry, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${entry.date || new Date().toLocaleDateString('de-DE')}</td>
                    <td>${getProjectName(entry.projectId)}</td>
                    <td>${getCustomerName(entry.customerId)}</td>
                    <td>${entry.description}</td>
                    <td>${entry.hours}</td>
                    <td><button onclick="deleteEntry(${index})">Löschen</button></td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Projektname aus ID
        function getProjectName(projectId) {
            const project = projects.find(p => p.id === projectId);
            return project ? project.name : 'Unbekannt';
        }

        // Kundenname aus ID
        function getCustomerName(customerId) {
            const customer = customers.find(c => c.id === customerId);
            return customer ? customer.name : 'Unbekannt';
        }

        // Stundeneintrag hinzufügen
        function addEntry() {
            const projectId = parseInt(document.getElementById('project').value);
            const customerId = parseInt(document.getElementById('customer').value);
            const description = document.getElementById('description').value.trim();
            const hours = parseFloat(document.getElementById('hours').value);

            if (!projectId || !customerId || !description || isNaN(hours) || hours <= 0) {
                alert('Bitte füllen Sie alle Felder aus und geben Sie eine positive Stundenanzahl ein!');
                return;
            }

            const newEntry = {
                date: new Date().toLocaleDateString('de-DE'),
                projectId: projectId,
                customerId: customerId,
                description: description,
                hours: hours
            };

            timeEntries.push(newEntry);
            localStorage.setItem('smartTimeData', JSON.stringify(timeEntries));
            updateTable();

            document.getElementById('description').value = '';
            document.getElementById('hours').value = '0';
            document.getElementById('customer').value = '';
        }

        // Eintrag löschen
        function deleteEntry(index) {
            timeEntries.splice(index, 1);
            localStorage.setItem('smartTimeData', JSON.stringify(timeEntries));
            updateTable();
        }

        // Rechnung generieren (mit 300€/h, 350€/h und Tagespauschale ab 8h)
function generateInvoice() {
    const projectId = parseInt(document.getElementById('invoiceProject').value);
    const customerId = parseInt(document.getElementById('invoiceCustomer').value);
    const monthInput = document.getElementById('invoiceMonth').value;

    if (!projectId || !customerId || !monthInput) {
        alert('Bitte wählen Sie Projekt, Kunde und Monat aus!');
        return;
    }

    // Monat im Format YYYY-MM in DD.MM.YYYY umwandeln und Filter erstellen
    const [year, month] = monthInput.split('-');
    const monthStart = new Date(year, parseInt(month) - 1, 1);
    const monthEnd = new Date(year, parseInt(month), 0);

    // Einträge nach Projekt, Kunde und Monat filtern
    const filteredEntries = timeEntries.filter(entry => {
        const [day, entryMonth, entryYear] = entry.date.split('.');
        const entryDate = new Date(`${entryYear}-${entryMonth}-${day}`);
        return entry.customerId === customerId &&
               entry.projectId === projectId &&
               entryDate >= monthStart &&
               entryDate <= monthEnd;
    });

    if (filteredEntries.length === 0) {
        alert(`Keine Einträge für Projekt: ${getProjectName(projectId)}, Kunde: ${getCustomerName(customerId)} und Monat: ${monthInput} gefunden!`);
        return;
    }

    // Rechnungsnummer generieren (RG-JJJJ-MM-NNN)
    const invoiceNumber = `RG-${year}-${month}-${String(nextInvoiceNumber).padStart(3, '0')}`;
    nextInvoiceNumber++;
    localStorage.setItem('nextInvoiceNumber', nextInvoiceNumber);

    // Monat als "Monatsname Jahr" formatieren
    const monthName = monthStart.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
    const invoiceDate = new Date().toLocaleDateString('de-DE');
    const customer = customers.find(c => c.id === customerId);
    const customerAddress = customer ? customer.address.replace(/\n/g, '\n') : '';

    // Stunden nach Tagen gruppieren und Beträge berechnen
    const dailyEntries = {};
    filteredEntries.forEach(entry => {
        if (!dailyEntries[entry.date]) {
            dailyEntries[entry.date] = { hours: 0, entries: [] };
        }
        dailyEntries[entry.date].hours += entry.hours;
        dailyEntries[entry.date].entries.push(entry);
    });

    // Rechnungstext erstellen
    let invoiceText = `
Jörg Steinbach
Wissenschafts- und Kulturpark Schwielowsee
14542 Schwielowsee

Tel.: +49 123 456789
E-Mail: joergstb@pm.me
Steuernummer: 123/456/78901

---
Rechnung Nr.: ${invoiceNumber}
Datum: ${invoiceDate}
---

An:
${getCustomerName(customerId)}
${customerAddress}

---
Projekt: ${getProjectName(projectId)}
Monat: ${monthName}

---
Leistungsbeschreibung:
---
`;

    // Tagesweise Berechnung
    let totalAmount = 0;
    for (const [date, dayData] of Object.entries(dailyEntries)) {
        const hours = dayData.hours;
        let dayAmount = 0;
        let dayDescription = '';

        if (hours >= 8) {
            // Tagespauschale: 3000€/Tag
            dayAmount = 3000;
            dayDescription = `${date}: ${hours} Stunden (Tagespauschale: 3.000 €)`;
        } else {
            // Einzelstunden: 300€/h oder 350€/h (je nach Vereinbarung)
            // Hier annehmen, dass die ersten 4 Stunden mit 350€/h und der Rest mit 300€/h abgerechnet wird
            // (Anpassbar nach deinen Regeln!)
            const highRateHours = Math.min(hours, 4); // Erste 4 Stunden zu 350€
            const lowRateHours = Math.max(hours - 4, 0); // Rest zu 300€
            dayAmount = (highRateHours * 350) + (lowRateHours * 300);
            dayDescription = `${date}: ${hours} Stunden (${highRateHours}x350€ + ${lowRateHours}x300€ = ${dayAmount} €)`;
        }

        totalAmount += dayAmount;
        invoiceText += `• ${dayDescription}\n`;
    }

    // MwSt. berechnen
    const taxRate = 0.19;
    const taxAmount = totalAmount * taxRate;
    const totalWithTax = totalAmount + taxAmount;

    invoiceText += `
---
Zwischensumme:   ${totalAmount.toFixed(2).replace('.', ',')} €
+ 19% MwSt.:      ${taxAmount.toFixed(2).replace('.', ',')} €
---
Gesamtbetrag:    ${totalWithTax.toFixed(2).replace('.', ',')} €

---
Zahlungsbedingungen: 14 Tage netto
Konto: DE89 3704 0044 0532 0130 00
BLZ: 37040044

---
Bitte überweisen Sie den Gesamtbetrag unter Angabe der Rechnungsnummer.
`;

    // Rechnung anzeigen
    document.getElementById('invoiceOutput').textContent = invoiceText;
}

        // Daten von GitHub importieren
        function importDataFromGitHub() {
            const githubRawUrl = 'https://raw.githubusercontent.com/jhstb/smart-time-invoice/main/smart_time_data.json';

            fetch(githubRawUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Datei nicht gefunden. Prüfe, ob die Datei im Repository existiert.');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.projects && data.projects.length > 0) {
                        projects = data.projects;
                    }
                    if (data.customers && data.customers.length > 0) {
                        customers = data.customers;
                    }
                    if (data.timeEntries) {
                        timeEntries = data.timeEntries.filter(entry => entry.hours > 0);
                    }
                    if (data.nextProjectId) {
                        nextProjectId = data.nextProjectId;
                    }
                    if (data.nextCustomerId) {
                        nextCustomerId = data.nextCustomerId;
                    }

                    localStorage.setItem('smartTimeData', JSON.stringify(timeEntries));
                    localStorage.setItem('projects', JSON.stringify(projects));
                    localStorage.setItem('customers', JSON.stringify(customers));
                    localStorage.setItem('nextProjectId', nextProjectId);
                    localStorage.setItem('nextCustomerId', nextCustomerId);

                    alert('Daten erfolgreich von GitHub importiert!');
                    updateAllDropdowns();
                    updateNewProjectCustomers();
                })
                .catch(error => {
                    alert('Fehler beim Importieren von GitHub: ' + error.message);
                });
        }

        // Daten nach GitHub exportieren
        function exportDataToGitHub() {
            const token = prompt('Bitte gib dein GitHub Personal Access Token ein (für den Export):');
            if (!token) {
                alert('Export abgebrochen: Kein Token eingegeben.');
                return;
            }

            const data = {
                timeEntries: timeEntries,
                projects: projects,
                customers: customers,
                nextProjectId: nextProjectId,
                nextCustomerId: nextCustomerId
            };

            const githubApiUrl = 'https://api.github.com/repos/jhstb/smart-time-invoice/contents/smart_time_data.json';

            fetch(githubApiUrl, {
                method: 'GET',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    if (response.status === 404) {
                        return { sha: null };
                    }
                    throw new Error(`Fehler beim Abrufen der SHA: ${response.statusText}`);
                }
                return response.json();
            })
            .then(fileData => {
                const sha = fileData.sha || null;
                const uploadData = {
                    message: 'Update smart_time_data.json via Smart Time & Invoice Suite',
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))))
                };
                if (sha) {
                    uploadData.sha = sha;
                }

                return fetch(githubApiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(uploadData)
                });
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => {
                        throw new Error(`GitHub API Fehler: ${err.message || response.statusText}`);
                    });
                }
                return response.json();
            })
            .then(() => {
                alert('Daten erfolgreich nach GitHub exportiert!');
            })
            .catch(error => {
                alert('Fehler beim Exportieren nach GitHub: ' + error.message);
            });
        }

        // Initialisierung
        loadLocalData();
        updateAllDropdowns();
        updateNewProjectCustomers();
    </script>
</body>
</html>
