<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Time & Invoice Suite</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smart Time & Invoice Suite</h1>

        <h2>Stundenerfassung</h2>
        <div class="form-group">
            <label for="project">Projekt:</label>
            <select id="project">
                <option value="">-- Projekt auswählen --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="customer">Kunde:</label>
            <select id="customer">
                <option value="">-- Kunde auswählen --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Beschreibung:</label>
            <input type="text" id="description">
        </div>

        <div class="form-group">
            <label for="hours">Stunden:</label>
            <input type="number" id="hours" step="0.25">
        </div>

        <button onclick="addEntry()">Stunde hinzufügen</button>
        <button onclick="importDataFromGitHub()">Daten von GitHub importieren</button>
        <button onclick="exportDataToGitHub()">Daten nach GitHub exportieren</button>

        <h2>Erfasste Stunden</h2>
        <table id="timeTable">
            <thead>
                <tr>
                    <th>Datum</th>
                    <th>Projekt</th>
                    <th>Kunde</th>
                    <th>Beschreibung</th>
                    <th>Stunden</th>
                    <th>Aktion</th>
                </tr>
            </thead>
            <tbody id="timeTableBody">
                <!-- Daten werden hier dynamisch eingefügt -->
            </tbody>
        </table>

        <h2>Rechnung erstellen</h2>
        <div class="form-group">
            <label for="invoiceCustomer">Kunde:</label>
            <select id="invoiceCustomer">
                <option value="">-- Kunde auswählen --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="invoiceProject">Projekt:</label>
            <select id="invoiceProject">
                <option value="">-- Projekt auswählen --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="invoiceMonth">Monat:</label>
            <input type="month" id="invoiceMonth">
        </div>

        <button onclick="generateInvoice()">Rechnung generieren</button>
    </div>

    <script>
        // Daten aus localStorage laden
        let timeEntries = JSON.parse(localStorage.getItem('smartTimeData') || '[]');
        let projects = JSON.parse(localStorage.getItem('projects') || '[]');
        let customers = JSON.parse(localStorage.getItem('customers') || '[]');

        // Standard-Projekte und Kunden (falls nicht vorhanden)
        if (projects.length === 0) {
            projects = [{ id: 1, name: "Wissenschafts- und Kulturpark Schwielowsee" }];
            localStorage.setItem('projects', JSON.stringify(projects));
        }

        if (customers.length === 0) {
            customers = [
                { id: 1, name: "Zweckverband" },
                { id: 2, name: "Christine Herntier" }
            ];
            localStorage.setItem('customers', JSON.stringify(customers));
        }

        // Dropdowns für Projekte und Kunden füllen
        function populateDropdowns() {
            const projectSelect = document.getElementById('project');
            const customerSelect = document.getElementById('customer');
            const invoiceCustomerSelect = document.getElementById('invoiceCustomer');
            const invoiceProjectSelect = document.getElementById('invoiceProject');

            // Projekte
            projectSelect.innerHTML = '<option value="">-- Projekt auswählen --</option>';
            projects.forEach(project => {
                const option = document.createElement('option');
                option.value = project.id;
                option.textContent = project.name;
                projectSelect.appendChild(option);
            });

            // Kunden
            customerSelect.innerHTML = '<option value="">-- Kunde auswählen --</option>';
            customers.forEach(customer => {
                const option = document.createElement('option');
                option.value = customer.id;
                option.textContent = customer.name;
                customerSelect.appendChild(option);
            });

            // Rechnungs-Kunde
            invoiceCustomerSelect.innerHTML = '<option value="">-- Kunde auswählen --</option>';
            customers.forEach(customer => {
                const option = document.createElement('option');
                option.value = customer.id;
                option.textContent = customer.name;
                invoiceCustomerSelect.appendChild(option);
            });

            // Rechnungs-Projekt
            invoiceProjectSelect.innerHTML = '<option value="">-- Projekt auswählen --</option>';
            projects.forEach(project => {
                const option = document.createElement('option');
                option.value = project.id;
                option.textContent = project.name;
                invoiceProjectSelect.appendChild(option);
            });
        }

        // Tabelle mit den erfassten Stunden aktualisieren
        function updateTable() {
            const tableBody = document.getElementById('timeTableBody');
            tableBody.innerHTML = '';

            timeEntries.forEach((entry, index) => {
                const row = document.createElement('tr');

                row.innerHTML = `
                    <td>${entry.date || new Date().toLocaleDateString('de-DE')}</td>
                    <td>${getProjectName(entry.projectId)}</td>
                    <td>${getCustomerName(entry.customerId)}</td>
                    <td>${entry.description}</td>
                    <td>${entry.hours}</td>
                    <td><button onclick="deleteEntry(${index})">Löschen</button></td>
                `;

                tableBody.appendChild(row);
            });
        }

        // Projektname aus ID holen
        function getProjectName(projectId) {
            const project = projects.find(p => p.id == projectId);
            return project ? project.name : 'Unbekannt';
        }

        // Kundenname aus ID holen
        function getCustomerName(customerId) {
            const customer = customers.find(c => c.id == customerId);
            return customer ? customer.name : 'Unbekannt';
        }

        // Neue Stundeneinträge hinzufügen
        function addEntry() {
            const projectId = document.getElementById('project').value;
            const customerId = document.getElementById('customer').value;
            const description = document.getElementById('description').value;
            const hours = document.getElementById('hours').value;

            if (!projectId || !customerId || !description || !hours) {
                alert('Bitte füllen Sie alle Felder aus!');
                return;
            }

            const newEntry = {
                date: new Date().toLocaleDateString('de-DE'),
                projectId: parseInt(projectId),
                customerId: parseInt(customerId),
                description: description,
                hours: parseFloat(hours)
            };

            timeEntries.push(newEntry);
            localStorage.setItem('smartTimeData', JSON.stringify(timeEntries));
            updateTable();

            // Felder zurücksetzen
            document.getElementById('description').value = '';
            document.getElementById('hours').value = '';
        }

        // Eintrag löschen
        function deleteEntry(index) {
            timeEntries.splice(index, 1);
            localStorage.setItem('smartTimeData', JSON.stringify(timeEntries));
            updateTable();
        }

        // Rechnung generieren
        function generateInvoice() {
            const customerId = document.getElementById('invoiceCustomer').value;
            const projectId = document.getElementById('invoiceProject').value;
            const month = document.getElementById('invoiceMonth').value;

            if (!customerId || !projectId || !month) {
                alert('Bitte wählen Sie Kunde, Projekt und Monat aus!');
                return;
            }

            const filteredEntries = timeEntries.filter(entry =>
                entry.customerId == customerId &&
                entry.projectId == projectId &&
                entry.date.startsWith(month)
            );

            if (filteredEntries.length === 0) {
                alert('Keine Einträge für die ausgewählten Kriterien gefunden!');
                return;
            }

            const totalHours = filteredEntries.reduce((sum, entry) => sum + entry.hours, 0);
            const rate = 6000; // 6000€ pro Tag (Beispielwert)
            const totalAmount = totalHours * rate;

            const invoiceText = `
                Rechnung für ${getCustomerName(customerId)}
                Projekt: ${getProjectName(projectId)}
                Monat: ${month}

                Erbrachte Leistungen:
                ${filteredEntries.map(entry =>
                    `- ${entry.date}: ${entry.description} (${entry.hours} Stunden)`
                ).join('\n')}

                Gesamtstunden: ${totalHours}
                Gesamtbetrag: ${totalAmount.toFixed(2)} €
            `;

            alert(`Rechnung generiert:\n\n${invoiceText}`);
        }

        // Daten von GitHub importieren
        function importDataFromGitHub() {
            const githubRawUrl = 'https://raw.githubusercontent.com/jhstb/smart-time-invoice/main/smart_time_data.json';

            fetch(githubRawUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Datei nicht gefunden. Prüfe, ob die Datei im Repository existiert.');
                    }
                    return response.json();
                })
                .then(data => {
                    timeEntries = data.timeEntries || [];
                    projects = data.projects || projects;
                    customers = data.customers || customers;

                    localStorage.setItem('smartTimeData', JSON.stringify(timeEntries));
                    localStorage.setItem('projects', JSON.stringify(projects));
                    localStorage.setItem('customers', JSON.stringify(customers));

                    alert('Daten erfolgreich von GitHub importiert!');
                    updateTable();
                    populateDropdowns();
                })
                .catch(error => {
                    alert('Fehler beim Importieren von GitHub: ' + error.message);
                });
        }

        // Daten nach GitHub exportieren (korrigierte Version)
function exportDataToGitHub() {
    const token = prompt('Bitte gib dein GitHub Personal Access Token ein (für den Export):');
    if (!token) {
        alert('Export abgebrochen: Kein Token eingegeben.');
        return;
    }

    const data = {
        timeEntries: timeEntries,
        projects: projects,
        customers: customers
    };

    const githubApiUrl = 'https://api.github.com/repos/jhstb/smart-time-invoice/contents/smart_time_data.json';

    fetch(githubApiUrl, {
        method: 'PUT',
        headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({
            message: 'Update smart_time_data.json via Smart Time & Invoice Suite',
            content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))))
        })
    })
    .then(response => {
        if (!response.ok) {
            return response.json().then(err => {
                throw new Error(`GitHub API Fehler: ${err.message || response.statusText}`);
            });
        }
        return response.json();
    })
    .then(() => {
        alert('Daten erfolgreich nach GitHub exportiert!');
    })
    .catch(error => {
        alert('Fehler beim Exportieren nach GitHub: ' + error.message);
    });
}
        // Initialisierung
        populateDropdowns();
        updateTable();
    </script>
</body>
</html>
